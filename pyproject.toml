[project]
name = "kython-mcp"
version = "0.1.0"
description = "Process-isolated Python session engine for PsyGo workspaces"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kython_mcp"]

[dependency-groups]
dev = [
    "ipython>=9.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]
