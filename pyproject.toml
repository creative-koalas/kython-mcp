[project]
name = "kython-mcp"
version = "0.1.0"
description = "Process-isolated Python session engine for PsyGo workspaces"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kython_mcp"]

[tool.protected-artifacts]
cython-targets = [
    "src/kython_mcp/executions.py",
    "src/kython_mcp/interpreter_runner.py",
    "src/kython_mcp/local_log.py",
    "src/kython_mcp/native.py",
    "src/kython_mcp/utils.py",
]
# worker.py is executed as a script by each session's own interpreter, which
# may differ from the host Python, so it must stay a plaintext .py file.
plaintext-runtime-py = [
    "src/kython_mcp/__init__.py",
    "src/kython_mcp/worker.py",
]

[dependency-groups]
dev = [
    "ipython>=9.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]
